<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Form Section -->
        <div class="form-section">
            <h2>Profile Card Generator</h2>

            <form id="profileForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="role">Role / Title</label>
                <input
                    type="text"
                    id="role"
                    placeholder="Enter your role"
                    required
                >

                <label for="skill">Skill Tag</label>
                <input
                    type="text"
                    id="skill"
                    placeholder="Enter your skill"
                    required
                >

                <button type="submit" class="generate-btn">
                    Generate Card
                </button>

            </form>
        </div>

        <!-- Card Preview -->
        <div class="card-section hidden" id="cardSection">

            <div class="profile-card">

                <div class="profile-image">
                    👤
                </div>

                <h2 id="cardName">Your Name</h2>

                <h4 id="cardRole">Your Role</h4>

                <p id="cardSkill">#Skill</p>

            </div>

            <button id="downloadBtn" class="download-btn">
                Save / Download PDF
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
